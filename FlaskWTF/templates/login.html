<!DOCTYPE HTML>

<html>
	<head>
		<title>Login</title>
	</head>
	<body>
        <div class="container">
		<h1>Login</h1>
		<form method="POST" action="{{url_for('login')}}" novalidate>
			{{form.csrf_token}}
			<p>
			{{form.email.label}}</p>
			{{form.email}}<br>
			{% for err in form.email.errors %}
			<span style="color:red">{{err}}</span>
			{% endfor %}
			<p>{{form.password.label}}</p>
			{{form.password}}<br>
			{% for err in form.password.errors %}
			<span style="color:red">{{err}}</span>
			{% endfor %}
			<p>{{form.submit.label}}</p>
			{{form.submit}}<br>
		</form>
        </div>
	</body>
</html>
